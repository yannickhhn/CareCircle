<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in · CareCircle</title>
        <link rel="icon" href="assets/carecircle-icon.png">
        <link href="css/style.css" rel="stylesheet">
        <link href="css/auth.css" rel="stylesheet">
    </head>
    <body class="auth-page">
        <main class="auth-main">
            <!-- Logo: takes the visitor back to the landing page -->
            <a href="index.html" class="auth-logo">
                <img src="assets/carecircle-logo.png" alt="CareCircle home">
            </a>

            <section class="auth-card" aria-labelledby="login-title">
                <h1 id="login-title">Welcome back !</h1>
                <p class="auth-tagline">Log in to see your household.</p>

                <!-- method="post": if JavaScript ever fails, the password is never put in the page address -->
                <form id="login-form" class="auth-form" method="post">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                               autocomplete="email" required
                               aria-describedby="email-error">
                        <p class="field-error" id="email-error" aria-live="polite"></p>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-wrap">
                            <!-- current-password: password managers fill in the saved password -->
                            <input type="password" id="password" name="password"
                                   autocomplete="current-password" required
                                   aria-describedby="password-error">
                            <button type="button" class="toggle-password"
                                    aria-controls="password" aria-pressed="false">Show</button>
                        </div>
                        <p class="field-error" id="password-error" aria-live="polite"></p>
                    </div>

                    <button type="submit" class="btn auth-submit">Log in</button>

                    <!-- general messages for the whole form (for example "Wrong email or password") -->
                    <p class="form-status" id="form-status" role="status"></p>
                </form>

                <p class="auth-switch">New to CareCircle? <a href="register.html">Create an account</a></p>
            </section>
        </main>
    </body>
</html>
